name: Profile Service CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        java-version: [ 21 ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Display Java version
      run: java -version

    - name: Run Checkstyle analysis
      run: ./mvnw checkstyle:check
      continue-on-error: false

    - name: Run PMD analysis
      run: ./mvnw pmd:check
      continue-on-error: false

    - name: Run SpotBugs analysis
      run: ./mvnw spotbugs:check
      continue-on-error: false

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    - name: Run tests with coverage
      run: ./mvnw test jacoco:report

    - name: Generate test report
      if: always()
      run: |
        mkdir -p test-reports
        cp target/surefire-reports/*.xml test-reports/ 2>/dev/null || true

    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: test-reports/
        retention-days: 30

    - name: Publish build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-java${{ matrix.java-version }}
        path: target/profile-service.jar
        retention-days: 30

    - name: Check build status
      if: failure()
      run: |
        echo "Build failed! Please check the logs above."
        exit 1

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
        cache: maven

    - name: Run security scan with SpotBugs
      run: ./mvnw spotbugs:check
      continue-on-error: true

    - name: Generate SpotBugs report
      if: always()
      run: |
        mkdir -p security-reports
        if [ -d target/spotbugs ]; then
          cp -r target/spotbugs security-reports/
        fi

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: security-reports/
        retention-days: 30

  docker-build-push:
    needs: [ build, security-scan ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    - name: Run Checkstyle
      run: ./mvnw checkstyle:check
      continue-on-error: true

    - name: Run PMD
      run: ./mvnw pmd:check
      continue-on-error: true

    - name: Generate CodeNarc reports
      if: always()
      run: |
        mkdir -p code-quality-reports
        if [ -d target/checkstyle-result.xml ]; then
          cp target/checkstyle-result.xml code-quality-reports/
        fi
        if [ -d target/pmd ]; then
          cp -r target/pmd code-quality-reports/
        fi
        if [ -d target/spotbugs ]; then
          cp -r target/spotbugs code-quality-reports/
        fi

    - name: Upload code quality reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: code-quality-reports/
        retention-days: 30
