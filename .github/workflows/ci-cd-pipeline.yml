name: Profile Service CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Code Linting & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        java-version: [ 21 ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Display Java version
      run: java -version

    - name: Run Checkstyle analysis
      run: ./mvnw checkstyle:check
      continue-on-error: false

    - name: Run PMD analysis
      run: ./mvnw pmd:check
      continue-on-error: false

    - name: Run SpotBugs analysis (linting mode)
      run: ./mvnw spotbugs:check
      continue-on-error: false

    - name: Publish linting artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports-java${{ matrix.java-version }}
        path: |
          target/checkstyle-result.xml
          target/pmd/pmd.xml
          target/spotbugsXml.xml
        retention-days: 30

  test:
    name: Run Unit Tests & Coverage
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        java-version: [ 21 ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Run tests with JaCoCo coverage
      run: ./mvnw test jacoco:report

    - name: Generate test report
      if: always()
      run: |
        mkdir -p test-reports
        cp target/surefire-reports/*.xml test-reports/ 2>/dev/null || true

    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-java${{ matrix.java-version }}
        path: test-reports/
        retention-days: 30

    - name: Check test coverage
      if: success()
      run: |
        echo "Test Coverage Report:"
        if [ -f target/site/jacoco/index.html ]; then
          echo "✓ JaCoCo coverage report generated"
        fi

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        java-version: [ 21 ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Build JAR with Maven
      run: ./mvnw clean package -DskipTests

    - name: Publish build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-java${{ matrix.java-version }}
        path: target/profile-service.jar
        retention-days: 30

    - name: Check build status
      if: failure()
      run: |
        echo "❌ Build failed! Please check the logs above."
        exit 1

    - name: Display build information
      if: success()
      run: |
        echo "✓ Build successful"
        ls -lh target/profile-service.jar

  security-scan:
    name: Security Scanning
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        java-version: [ 21 ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-java${{ matrix.java-version }}
        path: target/

    - name: Run comprehensive security scan with SpotBugs
      run: ./mvnw spotbugs:check
      continue-on-error: true

    - name: Generate security report
      if: always()
      run: |
        mkdir -p security-reports
        if [ -f target/spotbugsXml.xml ]; then
          cp target/spotbugsXml.xml security-reports/
        fi
        if [ -d target/spotbugs ]; then
          cp -r target/spotbugs security-reports/
        fi

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-java${{ matrix.java-version }}
        path: security-reports/
        retention-days: 30

    - name: Security scan summary
      if: always()
      run: |
        echo "✓ Security scanning completed"
        if [ -f security-reports/spotbugsXml.xml ]; then
          echo "  - SpotBugs report generated"
        fi

  docker-build-push:
    name: Build & Push Docker Image
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-java21
        path: target/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Docker push summary
      if: success()
      run: |
        echo "✓ Docker image successfully built and pushed"
        echo "  Registry: ${{ env.REGISTRY }}"
        echo "  Repository: ${{ env.IMAGE_NAME }}"
        echo "  Tags: ${{ steps.meta.outputs.tags }}"
